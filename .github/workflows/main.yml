name: Deploy

on:
  push:
  schedule:
    - cron: "0 8 * * 6" # 8AM Saturdays
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - environment: dev
            deploy-role-arn: AWS_DEPLOY_ROLE_ARN_DEV
            should_run: true
          - environment: prod
            deploy-role-arn: AWS_DEPLOY_ROLE_ARN_PROD
            should_run: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.should_run
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars[matrix.deploy-role-arn] }}
          aws-region: us-east-1
        if: matrix.should_run
      - name: Deploy to ${{ matrix.environment }}
        run: aws s3 sync --sse AES256 --delete src/ s3://apache-portal-com-${{ matrix.environment }}-therailroad
        if: matrix.should_run
